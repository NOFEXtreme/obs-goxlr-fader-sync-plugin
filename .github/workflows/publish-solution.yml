name: Publish Solution
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "FaderSyncPlugin Version Number"
        value: ${{ jobs.publish_windows.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  publish_windows:
    name: Create Windows Artifacts
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      PLUGIN_OUTPUT: FaderSyncPlugin/bin/Release/net10.0/win-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $target = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
              throw 'Inno Setup download checksum mismatch.'
          }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          "ISCC=$target\ISCC.exe" >> $env:GITHUB_ENV

      - name: Test Utility Client
        run: dotnet test UtilityClient.Test/UtilityClient.Test.csproj -c Release

      - name: Build and Verify Packages
        id: package
        run: |
          ./scripts/build-windows.ps1 -InnoCompiler $env:ISCC
          $version = (Get-Item "$env:PLUGIN_OUTPUT/publish/FaderSyncPlugin.dll").VersionInfo.ProductVersion.TrimEnd()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test Installer on Windows
        timeout-minutes: 10
        run: |
          ./scripts/test-installer.ps1 -Installer "$env:PLUGIN_OUTPUT/package/FaderSyncPlugin-win-x64-installer.exe" `
            -PluginBinary "$env:PLUGIN_OUTPUT/publish/FaderSyncPlugin.dll"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            ${{ env.PLUGIN_OUTPUT }}/package/FaderSyncPlugin-win-x64.zip
            ${{ env.PLUGIN_OUTPUT }}/package/FaderSyncPlugin-win-x64-obs32.zip
            ${{ env.PLUGIN_OUTPUT }}/package/FaderSyncPlugin-win-x64-portable.zip
            ${{ env.PLUGIN_OUTPUT }}/package/FaderSyncPlugin-win-x64-installer.exe
          compression-level: 0
          if-no-files-found: error

  publish_linux:
    name: Create Linux Artifacts
    runs-on: ubuntu-24.04
    env:
      PLUGIN_OUTPUT: FaderSyncPlugin/bin/Release/net10.0/linux-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup AOT Dependencies
        run: |
          if ! command -v clang >/dev/null || [[ ! -f /usr/include/zlib.h ]]; then
            sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
            sudo apt-get "${sources[@]}" update
            sudo apt-get "${sources[@]}" install -y clang zlib1g-dev
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test Utility Client
        run: dotnet test UtilityClient.Test/UtilityClient.Test.csproj -c Release

      - name: Build
        run: bash ./scripts/build-linux.sh

      - name: Verify Package
        shell: pwsh
        run: ./scripts/verify-packages.ps1 -LinuxDirectory "$env:PLUGIN_OUTPUT/package" -LinuxBinary "$env:PLUGIN_OUTPUT/publish/FaderSyncPlugin.so"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: ${{ env.PLUGIN_OUTPUT }}/package/FaderSyncPlugin-linux-x64.zip
          compression-level: 0
          if-no-files-found: error

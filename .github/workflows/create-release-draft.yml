name: Publish Beta Release
on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - .github/workflows/create-release-draft.yml
      - FaderSyncPlugin/FaderSyncPlugin.csproj

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/publish-solution.yml

  release:
    needs: [ publish ]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Verify Release Packages
        shell: pwsh
        run: |
          ./scripts/verify-packages.ps1 -WindowsDirectory artifacts/windows-artifacts `
            -LinuxDirectory artifacts/linux-artifacts -Manifest artifacts/SHA256SUMS.txt

      - name: Verify and Publish Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Expected a beta version, got '$VERSION'." >&2
            exit 1
          fi
          tag="v$VERSION"
          api="repos/$GITHUB_REPOSITORY"
          find_release() {
            gh api --paginate "$api/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          }
          tag_ref=$(git ls-remote --tags origin "refs/tags/$tag")
          release_id=$(find_release)
          if [[ -n "$tag_ref$release_id" ]]; then
            echo "A tag or release already exists for $tag." >&2
            exit 1
          fi
          files=(
            artifacts/windows-artifacts/FaderSyncPlugin-win-x64-installer.exe
            artifacts/windows-artifacts/FaderSyncPlugin-win-x64.zip
            artifacts/windows-artifacts/FaderSyncPlugin-win-x64-obs32.zip
            artifacts/windows-artifacts/FaderSyncPlugin-win-x64-portable.zip
            artifacts/linux-artifacts/FaderSyncPlugin-linux-x64.zip
            artifacts/SHA256SUMS.txt
          )
          gh release create "$tag" "${files[@]}" --draft --prerelease \
            --target "$GITHUB_SHA" --title "Release $VERSION" --generate-notes

          release_id=$(find_release)
          draft=$(gh api "$api/releases/$release_id")
          jq -e --arg tag "$tag" --arg commit "$GITHUB_SHA" \
            '.draft and .prerelease and .tag_name == $tag and .target_commitish == $commit' <<< "$draft"
          expected=$(sha256sum -- "${files[@]}" | awk '{sub(/^.*\//, "", $2); print "sha256:" $1 "  " $2}' | sort)
          uploaded=$(jq -r '.assets[] | select(.state == "uploaded") | "\(.digest)  \(.name)"' <<< "$draft" | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded")

          tag_ref=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -z "$tag_ref" ]]; then
            gh api --method POST "$api/git/refs" --silent \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          tag_sha=$(gh api "$api/git/ref/tags/$tag" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --prerelease --latest=false --verify-tag
          gh api "$api/releases/$release_id" | jq -e '(.draft | not) and .prerelease'
          printf 'Published `%s` at `%s` with all six verified assets.\n' "$tag" "$tag_sha" >> "$GITHUB_STEP_SUMMARY"

  svg { font: 15px system-ui, sans-serif; color-scheme: light dark }
  text { fill: #263344 }
  .background { fill: #f7f9fc; stroke: #dce2ea }
  .grid { stroke: #cfd7e2; fill: none }
  .measured { stroke: #006e66; stroke-width: 2.4; fill: none; stroke-linejoin: round }
  .original { stroke: #a14d1f; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4 }
  @media (prefers-color-scheme: dark) {
    text { fill: #e0e9f5 }
    .background { fill: #121923; stroke: #343e4e }
    .grid { stroke: #364354 }
    .measured { stroke: #5cdebf }
    .original { stroke: #ffb482 }
  }
</style>

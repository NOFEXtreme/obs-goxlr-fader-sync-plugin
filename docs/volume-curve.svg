<title id="title">GoXLR fader gain comparison</title>
<desc id="description">Gain in decibels against GoXLR fader position. GoXLR and this fork share a measured stepped curve, with silence on levels 0 through 8 shown separately below the finite scale. The original plugin line is its calculated target.</desc>
